<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1113">
<title>Car Buddy 疲勞守護</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen instrument panel. Portrait = single column (status, camera, gauges, controls).
   Landscape = camera + controls left, status + gauges + log right. Dark only, made for in-car night use. */
:root {
  --bg: #0e1113;
  --panel: #161a1d;
  --line: #262d32;
  --text: #e9edef;
  --muted: #8c979e;
  --accent: #8cc7ff;
  --ok: #3ddc97;
  --warn: #ffb02e;
  --danger: #ff5a5f;
  --ok-bg: #122520;
  --warn-bg: #2a2110;
  --danger-bg: #3b1518;
  --f-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-num); font-weight: 600; letter-spacing: .18em; font-size: 1.05rem; text-transform: uppercase; }
.brand small { font-family: var(--f-body); letter-spacing: .04em; font-weight: 500; color: var(--muted); font-size: .85rem; text-transform: none; margin-left: 8px; }
.engine { font-family: var(--f-num); font-size: .95rem; letter-spacing: .08em; color: var(--muted); text-align: right; }

main {
  display: grid; gap: 14px;
  grid-template-areas: "status" "cam" "gauges" "controls" "log" "settings";
}
#statusPanel { grid-area: status; }
#cam { grid-area: cam; }
#gauges { grid-area: gauges; }
#controls { grid-area: controls; }
#logPanel { grid-area: log; }
#settings { grid-area: settings; }
@media (orientation: landscape) and (min-width: 700px) {
  main {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "cam status" "cam gauges" "controls log" "settings settings";
    align-items: start;
  }
}

/* status */
#statusPanel {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 16px 18px 18px;
  cursor: default;
  user-select: none;
}
.status-label { font-family: var(--f-num); letter-spacing: .16em; font-size: .9rem; color: var(--muted); text-transform: uppercase; }
#stWord { font-size: clamp(2.8rem, 14vw, 4.6rem); line-height: 1.1; font-weight: 700; margin: 2px 0 4px; }
#stSub { margin: 0; color: var(--text); min-height: 3em; }
body[data-level="0"] #statusPanel { background: var(--ok-bg); border-color: #1f4a3b; }
body[data-level="0"] #stWord { color: var(--ok); }
body[data-level="1"] #statusPanel { background: var(--warn-bg); border-color: #5e4616; }
body[data-level="1"] #stWord { color: var(--warn); }
body[data-level="2"] #statusPanel { background: var(--danger-bg); border-color: #7a2a2e; }
body[data-level="2"] #stWord { color: var(--danger); }
body[data-level="idle"] #stWord, body[data-level="busy"] #stWord { color: var(--text); }
.flash { position: fixed; inset: 0; pointer-events: none; border: 0 solid var(--danger); z-index: 20; }
body[data-level="2"] .flash { border-width: 8px; animation: flash .6s steps(2, jump-none) infinite alternate; }
@keyframes flash { from { opacity: 1; } to { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { body[data-level="2"] .flash { animation: none; } }

/* camera */
#cam { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #050607; aspect-ratio: 4 / 3; max-width: 100%; }
#cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#cam.off video, #cam.off canvas { opacity: 0; }
#camMsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); font-size: .95rem; }
#cam.live #camMsg { display: none; }
#cam.off.live #camMsg { display: grid; }

/* gauges */
#gauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border-top: 1px solid var(--line); padding: 10px 2px 4px; min-width: 0; }
.tile .k { font-size: .85rem; color: var(--muted); }
.tile .v { font-family: var(--f-num); font-weight: 600; font-size: 2.6rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 1.1rem; color: var(--muted); margin-left: 3px; font-weight: 500; }
.meter { position: relative; height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ok); border-radius: 3px; transition: width .2s linear; }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.meter b.alarm { background: var(--danger); }
#stats { grid-column: 1 / -1; font-family: var(--f-num); letter-spacing: .06em; color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }

/* controls */
#controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; min-height: 48px; padding: 8px 14px; cursor: pointer;
}
button:hover { border-color: #3a444b; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { grid-column: 1 / -1; min-height: 58px; font-size: 1.15rem; font-weight: 700; background: var(--accent); color: #07131c; border-color: var(--accent); }
button.primary.stop { background: transparent; color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: .45; cursor: not-allowed; }

/* log */
#logPanel h2, #settings summary { font-size: .95rem; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
#log { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; font-size: .92rem; }
#log li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
#log time { color: var(--muted); font-family: var(--f-num); letter-spacing: .04em; flex: none; }
#log li:first-child.empty { color: var(--muted); }

/* settings */
#settings { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
#settings summary { cursor: pointer; margin: 0; padding: 6px 0; }
.set-grid { display: grid; gap: 14px; padding: 10px 0 6px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.row label { color: var(--text); }
.row output { font-family: var(--f-num); font-size: 1.1rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); min-height: 32px; }
.row .hint { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; margin: 0; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 40px; }

footer { color: var(--muted); font-size: .82rem; }
footer p { margin: 0 0 4px; }
#err { display: none; border: 1px solid #7a2a2e; background: var(--danger-bg); color: #ffd7d9; border-radius: 6px; padding: 10px 14px; font-size: .95rem; }
#err.show { display: block; }
</style>
</head>
<body data-level="idle">
<div class="flash" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand">Car Buddy<small>疲勞守護</small></div>
    <div class="engine" id="engine">—</div>
  </header>

  <div id="err" role="alert"></div>

  <main>
    <section id="statusPanel" aria-live="polite" title="警報響緊時輕按可以暫時靜音 10 秒">
      <div class="status-label">狀態</div>
      <div id="stWord">未開始</div>
      <p id="stSub">固定好手機，鏡頭望住你，按「開始偵測」。</p>
    </section>

    <section id="cam" class="off">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="camMsg">鏡頭未開啟</div>
    </section>

    <section id="gauges" aria-label="偵測數據">
      <div class="tile">
        <div class="k">閉眼比例（近 60 秒）</div>
        <div class="v"><span id="vPerclos">0</span><small>%</small></div>
        <div class="meter" aria-hidden="true"><i id="mPerclos"></i><b id="tWarn"></b><b id="tAlarm" class="alarm"></b></div>
      </div>
      <div class="tile">
        <div class="k">今次閉眼</div>
        <div class="v"><span id="vClosed">0.0</span><small>秒</small></div>
      </div>
      <div class="tile">
        <div class="k">哈欠</div>
        <div class="v"><span id="vYawn">0</span><small>次</small></div>
      </div>
      <div class="tile">
        <div class="k">頭部偏離</div>
        <div class="v"><span id="vHead">0</span><small>°</small></div>
      </div>
      <div id="stats">—</div>
    </section>

    <section id="controls">
      <button id="btnStart" class="primary" type="button">開始偵測</button>
      <button id="btnCal" type="button" disabled>重新校準</button>
      <button id="btnTest" type="button">測試警報</button>
    </section>

    <section id="logPanel">
      <h2>事件記錄</h2>
      <ul id="log"><li class="empty">未有事件</li></ul>
    </section>

    <details id="settings">
      <summary>設定</summary>
      <div class="set-grid">
        <div class="row">
          <label for="sens">靈敏度</label><output id="oSens">5</output>
          <input id="sens" type="range" min="1" max="9" step="1">
          <p class="hint">數字愈大愈易觸發。行車前先喺安全地方試。</p>
        </div>
        <div class="row">
          <label for="closedSec">閉眼多久先響警報</label><output id="oClosed">1.2 秒</output>
          <input id="closedSec" type="range" min="0.8" max="2.5" step="0.1">
        </div>
        <div class="row">
          <label for="vol">警報音量</label><output id="oVol">70%</output>
          <input id="vol" type="range" min="10" max="100" step="5">
          <p class="hint">手機本身嘅音量都要調高。</p>
        </div>
        <div class="row">
          <label for="fps">偵測上限</label>
          <select id="fps">
            <option value="8">8 fps（慳電、較凍）</option>
            <option value="12">12 fps</option>
            <option value="15">15 fps（較準）</option>
          </select>
        </div>
        <label class="check"><input id="voice" type="checkbox">警報時加語音提示</label>
        <label class="check"><input id="preview" type="checkbox">顯示鏡頭預覽（熄咗都會繼續偵測）</label>
      </div>
    </details>
  </main>

  <footer>
    <p>呢個係輔助提示，唔可以代替休息。覺得疲倦就要停車休息。</p>
    <p>手機要固定穩陣先開始，行車時唔好操作螢幕。鏡頭畫面只喺手機入面處理，唔會上傳。</p>
  </footer>
</div>
<noscript>呢個頁面需要 JavaScript。</noscript>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// To run offline, host these two yourself and point the constants at your own copies.
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d");

/* ---------- settings ---------- */
const CFG_KEY = "carbuddy.v1";
const defaults = { sens: 5, closedSec: 1.2, vol: 70, fps: 12, voice: true, preview: true };
let cfg = { ...defaults };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };

// thresholds derived from sensitivity (1..9, 5 = default)
const closedRatio = () => 0.60 + (cfg.sens - 5) * 0.03;
const perclosWarn = () => 0.15 - (cfg.sens - 5) * 0.01;
const perclosAlarm = () => 0.25 - (cfg.sens - 5) * 0.015;
const yawnThreshold = () => 0.55 - (cfg.sens - 5) * 0.03;
const headThreshold = () => 22 - (cfg.sens - 5) * 1.5;

function bindSettings() {
  $("sens").value = cfg.sens; $("closedSec").value = cfg.closedSec; $("vol").value = cfg.vol;
  $("fps").value = String(cfg.fps); $("voice").checked = cfg.voice; $("preview").checked = cfg.preview;
  const paint = () => {
    $("oSens").textContent = cfg.sens;
    $("oClosed").textContent = Number(cfg.closedSec).toFixed(1) + " 秒";
    $("oVol").textContent = cfg.vol + "%";
    $("cam").classList.toggle("off", !cfg.preview);
    $("camMsg").textContent = running ? "預覽已隱藏，偵測繼續運作" : "鏡頭未開啟";
    placeTicks();
  };
  $("sens").oninput = (e) => { cfg.sens = +e.target.value; saveCfg(); paint(); };
  $("closedSec").oninput = (e) => { cfg.closedSec = +e.target.value; saveCfg(); paint(); };
  $("vol").oninput = (e) => { cfg.vol = +e.target.value; saveCfg(); setGain(); paint(); };
  $("fps").onchange = (e) => { cfg.fps = +e.target.value; saveCfg(); };
  $("voice").onchange = (e) => { cfg.voice = e.target.checked; saveCfg(); };
  $("preview").onchange = (e) => { cfg.preview = e.target.checked; saveCfg(); paint(); };
  paint();
  bindSettings.paint = paint;
}
function placeTicks() {
  const max = 0.4;
  $("tWarn").style.left = Math.min(perclosWarn() / max, 1) * 100 + "%";
  $("tAlarm").style.left = Math.min(perclosAlarm() / max, 1) * 100 + "%";
}

/* ---------- audio, vibration, voice ---------- */
let actx = null, gainNode = null, alarmTimer = 0;
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = actx.createGain();
      gainNode.connect(actx.destination);
      setGain();
    }
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function setGain() { if (gainNode) gainNode.gain.value = cfg.vol / 100; }
function beep(freq, dur, type = "square", level = 1) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(level, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(gainNode);
  o.start(t); o.stop(t + dur + 0.03);
}
const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function chime() { beep(660, 0.25, "sine", 0.6); setTimeout(() => beep(880, 0.3, "sine", 0.6), 260); vibrate([120]); }
function startAlarm() {
  if (alarmTimer) return;
  const tick = () => { beep(988, 0.18); setTimeout(() => beep(740, 0.18), 220); vibrate([220, 80, 220]); };
  tick();
  alarmTimer = setInterval(tick, 700);
}
function stopAlarm() { clearInterval(alarmTimer); alarmTimer = 0; vibrate(0); try { speechSynthesis.cancel(); } catch (e) {} }
function speak(text) {
  if (!cfg.voice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK"; u.volume = cfg.vol / 100;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- geometry ---------- */
const LEFT_EYE = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const MOUTH = [13, 14, 78, 308];
const dist = (a, b, w, h) => Math.hypot((a.x - b.x) * w, (a.y - b.y) * h);
function eyeEAR(lm, idx, w, h) {
  const [p1, p2, p3, p4, p5, p6] = idx.map((i) => lm[i]);
  return (dist(p2, p6, w, h) + dist(p3, p5, w, h)) / (2 * dist(p1, p4, w, h));
}
function mouthMAR(lm, w, h) { return dist(lm[13], lm[14], w, h) / dist(lm[78], lm[308], w, h); }
// head pitch from forehead (10) to chin (152): angle of that vector in the depth/vertical plane
function headPitch(lm, w, h) {
  const a = lm[10], b = lm[152];
  return Math.atan2((b.z - a.z) * w, (b.y - a.y) * h) * 180 / Math.PI;
}
const wrap = (x) => { while (x > 180) x -= 360; while (x < -180) x += 360; return x; };
const sorted = (arr) => arr.slice().sort((a, b) => a - b);
const median = (arr) => { const s = sorted(arr); return s[Math.floor(s.length / 2)]; };
const percentile = (arr, p) => { const s = sorted(arr); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };

/* ---------- state ---------- */
let landmarker = null, delegateName = "—", stream = null, running = false, rafId = 0, wakeLock = null;
let lastRun = 0, lastVideoTime = -1, inferMs = 0, fpsEma = 0;
let st = newState();
function newState() {
  return {
    phase: "idle", calStart: 0, cal: { ear: [], mar: [], pitch: [] },
    base: { ear: 0.3, mar: 0.05, pitch: 0 },
    ear: 0, mar: 0, pitch: null,
    closedSince: 0, openStreak: 0, closedDur: 0,
    win: [], winClosed: 0, perclos: 0, perclosValid: false,
    yawnSince: 0, yawnLatched: false, yawns: 0, yawnTimes: [], yawnWarnUntil: 0,
    headSince: 0, headDur: 0, headDev: 0,
    noFaceSince: 0, lastNoFaceChime: 0,
    alarmOn: false, alarmStart: 0, lastDangerAt: 0, muteUntil: 0, alarms: 0,
    level: "idle", msg: "", startAt: 0, events: [],
  };
}

/* ---------- log ---------- */
function log(text) {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0"), ss = String(d.getSeconds()).padStart(2, "0");
  st.events.unshift({ t: `${hh}:${mm}:${ss}`, text });
  st.events.length = Math.min(st.events.length, 6);
  const ul = $("log");
  ul.textContent = "";
  for (const e of st.events) {
    const li = document.createElement("li");
    const tm = document.createElement("time"); tm.textContent = e.t;
    const sp = document.createElement("span"); sp.textContent = e.text;
    li.append(tm, sp); ul.append(li);
  }
}

/* ---------- model + camera ---------- */
async function initLandmarker() {
  if (landmarker) return;
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const make = (delegate) => FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO", numFaces: 1,
    outputFaceBlendshapes: false, outputFacialTransformationMatrixes: false,
  });
  try { landmarker = await make("GPU"); delegateName = "GPU"; }
  catch (e) { landmarker = await make("CPU"); delegateName = "CPU"; }
}
function showErr(msg) { const e = $("err"); e.textContent = msg; e.classList.toggle("show", !!msg); }
function setPanel(level, word, sub) {
  document.body.dataset.level = level;
  $("stWord").textContent = word; $("stSub").textContent = sub;
}
async function lockScreen() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (running && document.visibilityState === "visible") lockScreen(); });

async function start() {
  showErr("");
  if (!window.isSecureContext || !navigator.mediaDevices) {
    showErr("鏡頭只可以喺 HTTPS 網頁使用。請將呢個檔放上你自己嘅 HTTPS 網站再開。");
    return;
  }
  ensureAudio();
  $("btnStart").disabled = true;
  setPanel("busy", "載入中", "正在載入 AI 模型，首次需要下載幾 MB 資料。");
  try { await initLandmarker(); }
  catch (e) {
    $("btnStart").disabled = false;
    setPanel("idle", "未開始", "模型載入失敗。");
    showErr("AI 模型載入失敗，請檢查網絡後再試。（" + (e && e.message ? e.message : e) + "）");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 15, max: 30 } },
      audio: false,
    });
  } catch (e) {
    $("btnStart").disabled = false;
    setPanel("idle", "未開始", "未能開啟鏡頭。");
    showErr(e && e.name === "NotAllowedError"
      ? "鏡頭權限被拒絕。請喺 Chrome 網址列旁邊嘅鎖頭圖示允許鏡頭，再按開始。"
      : "開唔到前置鏡頭，可能被其他程式佔用。（" + (e && e.name) + "）");
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  overlay.width = video.videoWidth || 480; overlay.height = video.videoHeight || 360;
  $("cam").classList.add("live");
  lockScreen();
  st = newState(); st.startAt = performance.now();
  running = true;
  beginCalibration();
  $("btnStart").disabled = false;
  $("btnStart").textContent = "停止";
  $("btnStart").classList.add("stop");
  $("btnCal").disabled = false;
  $("engine").textContent = delegateName;
  bindSettings.paint();
  log("開始偵測");
  loop();
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  stopAlarm();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
  $("cam").classList.remove("live");
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const mins = Math.max(0, Math.round((performance.now() - st.startAt) / 60000));
  setPanel("idle", "已停止", `今次偵測 ${mins} 分鐘，警報 ${st.alarms} 次，哈欠 ${st.yawns} 次。`);
  $("btnStart").textContent = "開始偵測";
  $("btnStart").classList.remove("stop");
  $("btnCal").disabled = true;
  bindSettings.paint();
}

function beginCalibration() {
  st.phase = "calibrating"; st.calStart = performance.now();
  st.cal = { ear: [], mar: [], pitch: [] };
  st.closedSince = 0; st.openStreak = 0; st.win = []; st.winClosed = 0; st.headSince = 0; st.yawnSince = 0; st.yawnLatched = false;
  if (st.alarmOn) { st.alarmOn = false; stopAlarm(); }
}

/* ---------- main loop ---------- */
function loop() {
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  const now = performance.now();
  if (now - lastRun < 1000 / cfg.fps) return;
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const dt = now - lastRun; lastRun = now;
  fpsEma = fpsEma ? fpsEma * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;
  const t0 = performance.now();
  let res;
  try { res = landmarker.detectForVideo(video, now); }
  catch (e) { showErr("偵測出錯：" + (e && e.message ? e.message : e)); stop(); return; }
  const ms = performance.now() - t0;
  inferMs = inferMs ? inferMs * 0.9 + ms * 0.1 : ms;
  handle(res, now);
}

function handle(res, now) {
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  if (!lm) { onNoFace(now); draw(null); render(now); return; }
  st.noFaceSince = 0;
  const w = video.videoWidth, h = video.videoHeight;
  st.ear = (eyeEAR(lm, LEFT_EYE, w, h) + eyeEAR(lm, RIGHT_EYE, w, h)) / 2;
  st.mar = mouthMAR(lm, w, h);
  const p = headPitch(lm, w, h);
  st.pitch = st.pitch == null ? p : st.pitch * 0.6 + p * 0.4;
  if (st.phase === "calibrating") calibrate(now); else monitor(now);
  draw(lm);
  render(now);
}

function calibrate(now) {
  st.cal.ear.push(st.ear); st.cal.mar.push(st.mar); st.cal.pitch.push(st.pitch);
  if (now - st.calStart >= 5000 && st.cal.ear.length >= 25) {
    const ear = percentile(st.cal.ear, 0.75);
    if (ear < 0.12) { log("校準失敗：偵測唔到睜開嘅眼"); beginCalibration(); return; }
    st.base = { ear, mar: median(st.cal.mar), pitch: median(st.cal.pitch) };
    st.phase = "monitoring"; st.level = 0; st.msg = "";
    log(`校準完成（睜眼 ${ear.toFixed(2)}）`);
    chime();
  }
}

function onNoFace(now) {
  if (!st.noFaceSince) st.noFaceSince = now;
  st.closedSince = 0; st.headSince = 0; st.yawnSince = 0;
  const dur = now - st.noFaceSince;
  if (st.phase === "monitoring" && dur > 4000) {
    st.level = 1; st.msg = "見唔到你塊臉，請調整手機位置。";
    if (now - st.lastNoFaceChime > 12000) {
      if (!st.lastNoFaceChime) log("見唔到司機");
      st.lastNoFaceChime = now; chime();
    }
  }
}

function monitor(now) {
  // eyes
  const closed = st.ear < st.base.ear * closedRatio();
  if (closed) { if (!st.closedSince) st.closedSince = now; st.openStreak = 0; }
  else { st.openStreak++; if (st.openStreak >= 2) st.closedSince = 0; }
  st.closedDur = st.closedSince ? (now - st.closedSince) / 1000 : 0;

  // PERCLOS over a 60 s window
  st.win.push({ t: now, c: closed ? 1 : 0 }); st.winClosed += closed ? 1 : 0;
  while (st.win.length && now - st.win[0].t > 60000) st.winClosed -= st.win.shift().c;
  st.perclos = st.win.length ? st.winClosed / st.win.length : 0;
  st.perclosValid = st.win.length > 1 && now - st.win[0].t >= 20000;

  // yawn: mouth wide open for a sustained moment
  const yt = yawnThreshold();
  if (st.mar > yt) {
    if (!st.yawnSince) st.yawnSince = now;
    if (!st.yawnLatched && now - st.yawnSince >= 1200) { st.yawnLatched = true; onYawn(now); }
  } else if (st.mar < yt * 0.7) { st.yawnSince = 0; st.yawnLatched = false; }

  // head: deviation from calibrated posture
  st.headDev = Math.abs(wrap(st.pitch - st.base.pitch));
  if (st.headDev > headThreshold()) { if (!st.headSince) st.headSince = now; } else st.headSince = 0;
  st.headDur = st.headSince ? (now - st.headSince) / 1000 : 0;

  // decide level
  const closedDanger = st.closedDur >= cfg.closedSec;
  const headDanger = st.headDur >= 1.5;
  const perclosDanger = st.perclosValid && st.perclos >= perclosAlarm();
  const danger = closedDanger || headDanger || perclosDanger;
  let level = 0, msg = "偵測中，保持專注。";
  if (danger) {
    level = 2;
    msg = closedDanger ? `閉眼超過 ${cfg.closedSec.toFixed(1)} 秒，請盡快安全停車休息。`
      : headDanger ? "頭部低垂或偏離太耐，請盡快安全停車休息。"
      : "最近一分鐘閉眼比例偏高，請盡快安全停車休息。";
  } else if ((st.perclosValid && st.perclos >= perclosWarn()) || now < st.yawnWarnUntil || st.closedDur >= 0.6) {
    level = 1;
    msg = st.yawnTimes.length >= 3 ? "10 分鐘內打咗 3 次或以上哈欠，建議休息。"
      : now < st.yawnWarnUntil ? "打咗哈欠，留意精神狀態。"
      : "有疲倦跡象，留意休息。";
  }

  // alarm control
  if (danger) {
    st.lastDangerAt = now;
    if (!st.alarmOn && now > st.muteUntil) {
      st.alarmOn = true; st.alarmStart = now; st.alarms++;
      log(closedDanger ? "警報：長時間閉眼" : headDanger ? "警報：頭部低垂" : "警報：閉眼比例高");
      startAlarm();
      setTimeout(() => { if (st.alarmOn) speak("請注意，你可能打瞌睡，請盡快在安全地方停車休息。"); }, 1300);
    }
    if (perclosDanger && !closedDanger && !headDanger) { st.win = []; st.winClosed = 0; }
  }
  if (st.alarmOn && !closedDanger && !headDanger && now - st.alarmStart > 4000 && now - st.lastDangerAt > 1500) {
    st.alarmOn = false; stopAlarm();
  }
  st.level = st.alarmOn ? 2 : level;
  st.msg = st.alarmOn && !danger ? "警報完結中，請留意休息。" : msg;
}

function onYawn(now) {
  st.yawns++;
  st.yawnTimes.push(now);
  st.yawnTimes = st.yawnTimes.filter((t) => now - t < 600000);
  st.yawnWarnUntil = now + 20000;
  log(st.yawnTimes.length >= 3 ? `打哈欠（10 分鐘內第 ${st.yawnTimes.length} 次）` : "打哈欠");
  chime();
}

/* ---------- drawing + rendering ---------- */
const COLORS = { 0: "#3ddc97", 1: "#ffb02e", 2: "#ff5a5f" };
function draw(lm) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (!lm || !cfg.preview) return;
  octx.fillStyle = COLORS[st.level] || "#8cc7ff";
  const r = Math.max(2, overlay.width / 160);
  for (const i of [...LEFT_EYE, ...RIGHT_EYE, ...MOUTH]) {
    octx.beginPath();
    octx.arc(lm[i].x * overlay.width, lm[i].y * overlay.height, r, 0, 6.2832);
    octx.fill();
  }
}

let lastLevelKey = "";
function render(now) {
  if (st.phase === "calibrating") {
    const el = now - st.calStart;
    const pct = Math.round(Math.min(1, Math.max(el / 5000, st.cal.ear.length / 25)) * 100);
    const face = st.noFaceSince ? "見唔到你塊臉，請調整手機位置。" : `請正視前方，自然睜眼，唔好傾側頭。${pct}%`;
    setPanel("busy", "校準中", face);
  } else if (st.phase === "monitoring") {
    const names = ["清醒", "留意", "危險"];
    const key = st.level + "|" + st.msg;
    if (key !== lastLevelKey) { lastLevelKey = key; setPanel(String(st.level), names[st.level], st.msg); }
  }
  const pc = Math.round(st.perclos * 100);
  $("vPerclos").textContent = st.perclosValid ? pc : "—";
  $("mPerclos").style.width = Math.min(st.perclos / 0.4, 1) * 100 + "%";
  $("mPerclos").style.background = st.perclos >= perclosAlarm() ? "var(--danger)" : st.perclos >= perclosWarn() ? "var(--warn)" : "var(--ok)";
  $("vClosed").textContent = st.closedDur.toFixed(1);
  $("vYawn").textContent = st.yawns;
  $("vHead").textContent = Math.round(st.headDev);
  const secs = Math.floor((now - st.startAt) / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2, "0"), ss = String(secs % 60).padStart(2, "0");
  $("stats").textContent = `${mm}:${ss} · ${fpsEma.toFixed(0)} FPS · ${inferMs.toFixed(0)} MS · 警報 ${st.alarms} · EAR ${st.ear.toFixed(2)} / ${(st.base.ear * closedRatio()).toFixed(2)}`;
}

/* ---------- wiring ---------- */
$("btnStart").onclick = () => (running ? stop() : start());
$("btnCal").onclick = () => { if (running) { beginCalibration(); log("重新校準"); } };
$("btnTest").onclick = () => {
  ensureAudio();
  startAlarm();
  setTimeout(() => { if (!st.alarmOn) stopAlarm(); }, 2200);
};
$("statusPanel").onclick = () => {
  if (st.alarmOn) { st.alarmOn = false; stopAlarm(); st.muteUntil = performance.now() + 10000; log("手動靜音 10 秒"); }
};
bindSettings();
</script>
</body>
</html>
